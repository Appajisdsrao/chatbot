<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            color: white;
            background-color: #0d0d0d;
            overflow: hidden;
            position: relative;
        }

        /* Rotate the background container */
        .background-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            animation: rotateBackground 100s linear infinite;
        }

        /* Star Animation */
        .stars-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            animation: twinkling 1.5s infinite alternate;
        }

        @keyframes twinkling {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* Sun and Moon Animation */
        .sun, .moon {
            position: absolute;
            border-radius: 50%;
            background: yellow;
            animation: rotateAroundCenter 20s linear infinite;
        }

        .sun {
            width: 150px;
            height: 150px;
            top: 20px;
            left: 80%;
            background: radial-gradient(circle, rgba(255, 255, 0, 1) 0%, rgba(255, 204, 0, 0) 70%);
        }

        .moon {
            width: 120px;
            height: 120px;
            top: 40px;
            left: 10%;
            background: radial-gradient(circle, rgba(255, 255, 255, 1) 0%, rgba(200, 200, 200, 0) 70%);
        }

        /* Earth Rotation */
        .earth {
            position: absolute;
            border-radius: 50%;
            background: #0d67b5;
            width: 100px;
            height: 100px;
            top: 100px;
            left: 45%;
            animation: rotateAroundSun 10s linear infinite;
        }

        @keyframes rotateBackground {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes rotateAroundCenter {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes rotateAroundSun {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Chat Animation */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .chat-container {
            width: 400px;
            max-width: 90%;
            background: rgba(20, 20, 30, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(255, 255, 255, 0.2);
            text-align: center;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
            animation: fadeIn 1s ease-in-out;
        }

        .chat-box {
            height: 300px;
            overflow-y: auto;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        .message {
            padding: 10px;
            border-radius: 10px;
            margin: 5px;
            max-width: 70%;
            word-wrap: break-word;
            display: block;
            opacity: 0;
        }

        .user-message {
            background: #1a73e8;
            color: white;
            text-align: right;
            align-self: flex-end;
            animation: slideInRight 0.5s ease-in-out forwards;
        }

        .bot-message {
            background: #444;
            color: white;
            text-align: left;
            align-self: flex-start;
            animation: slideInLeft 0.5s ease-in-out forwards;
        }

        .input-container {
            display: flex;
            animation: fadeIn 1s ease-in-out;
        }

        input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #1a73e8;
            color: white;
            cursor: pointer;
            margin-left: 5px;
        }

        .footer {
            position: fixed;
            bottom: 10px;
            right: 20px;
            font-size: 14px;
            color: yellow;
            font-weight: bold;
            text-align: center;
        }
    </style>
    <script>
        function sendMessage() {
            var input = document.getElementById("user-input");
            var message = input.value.trim();
            if (message === "") return;

            var chatBox = document.getElementById("chat-box");
            var userMessage = document.createElement("div");
            userMessage.className = "message user-message";
            userMessage.innerText = message;
            chatBox.appendChild(userMessage);
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Send the message to the Flask API and get the response
            fetch('http://localhost:5000/ask', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                var botMessage = document.createElement("div");
                botMessage.className = "message bot-message";
                botMessage.innerText = data.response;
                chatBox.appendChild(botMessage);
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(error => {
                var botMessage = document.createElement("div");
                botMessage.className = "message bot-message";
                botMessage.innerText = "Sorry, something went wrong. Please try again later.";
                chatBox.appendChild(botMessage);
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</head>
<body>
    <div class="background-container">
        <div class="stars-container">
            <!-- Add stars dynamically with JavaScript -->
            <script>
                for (let i = 0; i < 200; i++) {
                    const star = document.createElement("div");
                    star.classList.add("star");
                    star.style.top = Math.random() * 100 + "%";
                    star.style.left = Math.random() * 100 + "%";
                    document.querySelector(".stars-container").appendChild(star);
                }
            </script>
        </div>

        <!-- Sun, Moon, Earth -->
        <div class="sun"></div>
        <div class="moon"></div>
        <div class="earth"></div>
    </div>

    <div class="chat-container">
        <h2>AI Chatbot</h2>
        <div class="chat-box" id="chat-box"></div>
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <div class="footer">Done by Sai charan<br>Creating a Chatbot</div>
</body>
</html>
